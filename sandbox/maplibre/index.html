<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earthquake Tracker · MapLibre Sandbox</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      // The style document declares data sources and the ordered layers that render them.
      const BASEMAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
      const EARTHQUAKE_LAYER_ID = 'earthquake-points';
      const EARTHQUAKE_SOURCE_ID = 'earthquakes';
      const SIGNIFICANT_EARTHQUAKE_LAYER_ID = 'significant-earthquake-points';
      const SIGNIFICANT_MAGNITUDE = 6;
      const INITIAL_CENTER = [-70.6693, -33.4489];
      const INITIAL_ZOOM = 3;
      const earthquakeData = {
        type: 'FeatureCollection',
        features: [
          {
            type: 'Feature',
            properties: {
              mag: 4.2,
              place: 'Santiago, Chile',
            },
            geometry: {
              type: 'Point',
              coordinates: [-70.6693, -33.4489],
            },
          },
          {
            type: 'Feature',
            properties: {
              mag: 5.1,
              place: 'Concepción, Chile',
            },
            geometry: {
              type: 'Point',
              coordinates: [-73.0498, -36.827],
            },
          },
          {
            type: 'Feature',
            properties: {
              mag: 6.4,
              place: 'Antofagasta, Chile',
            },
            geometry: {
              type: 'Point',
              coordinates: [-70.4006, -23.65],
            },
          },
        ],
      };

      const map = new maplibregl.Map({
        container: 'map',
        style: BASEMAP_STYLE_URL,
        center: INITIAL_CENTER,
        zoom: INITIAL_ZOOM,
      });

      map.once('load', () => {
        map.addSource(EARTHQUAKE_SOURCE_ID, {
          type: 'geojson',
          data: earthquakeData,
        });

        map.addLayer({
          id: EARTHQUAKE_LAYER_ID,
          type: 'circle',
          source: EARTHQUAKE_SOURCE_ID,
          paint: {
            'circle-color': '#e11d48',
            'circle-radius': 8,
          },
        });

        map.addLayer({
          id: SIGNIFICANT_EARTHQUAKE_LAYER_ID,
          type: 'circle',
          source: EARTHQUAKE_SOURCE_ID,
          filter: ['>=', ['get', 'mag'], SIGNIFICANT_MAGNITUDE],
          paint: {
            'circle-color': '#f59e0b',
            'circle-radius': 12,
          },
        });
      });
    </script>
  </body>
</html>
