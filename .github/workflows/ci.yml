name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Schema USGS
        run: npm run test:usgs-schema

      - name: Merge EMSC
        run: npm run test:emsc-merge

      - name: Coordenadas locales
        run: npm run test:local-coordinates

      - name: Estado ShakeMap UI
        run: npm run test:shakemap-status

      - name: Contornos ShakeMap schema
        run: npm run test:shakemap-contours

      - name: Compilar
        run: npm run build
